# Repositories, index fetching, install and update, signatures, trust store, `SourceRegistry`.
#
# Registration is manifest-first: runtimes are created lazily and pooled rather than started for
# every installed extension at launch.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_extension_manager
description: "Repositories, index fetching, install and update, signatures, trust store, `SourceRegistry`."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dependencies:
  kikuyomi_source_api:
    path: ../source_api
  kikuyomi_source_runtime:
    path: ../source_runtime
  kikuyomi_sources_builtin:
    path: ../sources_builtin
  kikuyomi_domain:
    path: ../domain
  # Fetching a repository's index is this package's own job (§3.8), and it goes through the app's one
  # transport so a repository gets the same User-Agent, timeouts, body limits and per-host rate
  # limiting everything else does.
  kikuyomi_networking:
    path: ../networking
  # §3.7's source id: the first 8 bytes of SHA-256 over the extension, source, language and version.
  # Dart team, BSD-3-Clause, pure Dart.
  crypto: ^3.0.6
  # A repository serves each extension as one zip (§3.2). Pure Dart, so it needs nothing of Android,
  # Windows or iOS and works the same on all three. Brendan Duncan, MIT.
  archive: ^4.0.0
  # Ed25519: verifying that a repository signed the package it is offering (§3.8, ADR-0018), and
  # signing one in the tool that builds a publishable repository. Pure Dart, so Android, Windows and
  # iOS all get the same implementation and none of them needs a platform channel. Gohilla,
  # Apache-2.0.
  cryptography: ^2.7.0

dev_dependencies:
  test: ^1.25.0
