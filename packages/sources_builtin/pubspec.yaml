# Built-in native sources: Local files, Audiobookshelf and OPDS.
#
# These implement the same contract as extensions, so the app is a complete audiobook player
# with nothing installed.
#
# See docs/architecture.md section 2.4. Folder name is short; the package name carries the
# kikuyomi_ prefix so it cannot collide with a published package.
name: kikuyomi_sources_builtin
description: "Built-in native sources: Local files, Audiobookshelf and OPDS."
version: 0.1.0
publish_to: none

# Member of the pub workspace rooted at ../../pubspec.yaml.
resolution: workspace

environment:
  sdk: "^3.13.3"

dependencies:
  # Reading EPUBs, which are zips (ADR-0019). Pure Dart, so it runs on Android, iOS and Windows.
  archive: ^4.0.0
  # The HTML parser the block converter in source_api uses, for EPUB tables of contents and headings.
  html: ^0.15.6
  kikuyomi_source_api:
    path: ../source_api
  kikuyomi_networking:
    path: ../networking
  # The XML inside an EPUB: its container, package document and NCX. Pure Dart.
  xml: ^7.0.0

dev_dependencies:
  test: ^1.25.0
