org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compilation is off because on Windows it does not work here. Every plugin
# module fails at the end of its compile task with "Could not close incremental caches ...
# class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab" — all six
# together, on a cache cleared immediately before, so it is not corruption left by an interrupted
# build. The likeliest cause is a file handle still held when the task finishes, which the
# redirected build directory this template configures makes more likely, and which a virus scanner
# watching the drive would make worse.
#
# The cost of turning it off is close to nothing: the only Kotlin here is plugin glue, a couple of
# hundred lines across six modules, and the app itself is Dart. The cost of leaving it on is that
# the project cannot be built for Android at all on its primary development machine. Revisit if the
# underlying fault is ever identified; it is a workaround and is not pretending otherwise.
kotlin.incremental=false
